<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BanquetQ — Staff Dashboard</title>
  <link rel="stylesheet" href="../shared/styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <script src="config.js"></script>
</head>
<body>

  <!-- ============ PASSCODE LOCK ============ -->
  <div class="wrap" id="view-lock" hidden>
    <div class="lockwrap">
      <div class="lock">
        <span class="brandmark">Q</span>
        <div class="n">BANQUETQ · HALL DASHBOARD</div>
        <h1 class="page" style="margin-bottom:8px">Welcome back</h1>
        <p class="sub" style="margin-bottom:22px">Enter your hall passcode to continue.</p>
        <input type="password" id="inPass" inputmode="numeric" autocomplete="off"
               placeholder="••••" aria-label="Hall passcode" />
        <div class="err" id="passErr" style="text-align:center;margin:10px 0 0">Wrong passcode. Try again.</div>
        <div style="height:16px"></div>
        <button class="btn primary" id="btnUnlock">Unlock</button>
      </div>
    </div>
  </div>

  <!-- ============ DASHBOARD ============ -->
  <div class="wrap wide" id="view-dash" hidden>
    <header class="top">
      <div class="brand">
        <span class="brandmark">Q</span>
        <span class="brandtext"><strong>BanquetQ</strong><small>Hall dashboard · <span id="todayLine">Today</span></small></span>
      </div>
      <div class="topactions">
        <button class="btn ghost small" id="btnMute" aria-pressed="true">Sound on</button>
        <button class="btn ghost small" id="btnPasscode">Passcode</button>
        <span class="live"><i></i>Live</span>
      </div>
    </header>

    <div class="cfg-warn" data-cfg-warn hidden>
      Not connected yet. Add your Supabase URL and anon key in <code>config.js</code>,
      or open with <code>?demo=1</code> to preview.
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="stBooked">0</div><div class="l">Booked</div></div>
      <div class="stat"><div class="n" id="stDone">0</div><div class="l">Done</div></div>
      <div class="stat"><div class="n" id="stCancelled">0</div><div class="l">Cancelled</div></div>
    </div>

    <label class="lbl" style="margin-top:18px">Date</label>
    <div class="slotchips" id="dateChips" role="group" aria-label="Booking date"></div>

    <div style="height:14px"></div>
    <div id="bookList"></div>
  </div>

  <div class="toast" id="toast"></div>
  <script type="module" src="admin.js"></script>
  <script>
    setTimeout(function () {
      if (window.__sqBoot) return;
      var t = document.getElementById("toast");
      t.textContent = "Preview tip: serve this folder over HTTP (deployed URL, or run: python3 -m http.server) — it does not run from file://.";
      t.classList.add("show");
    }, 2500);
  </script>
</body>
</html>
